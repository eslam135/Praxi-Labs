<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praxi Physics Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="top-bar__brand" id="top-bar-brand"></div>
      </header>
      <main class="app-body">
        <aside class="panel panel--params">
          <section id="experiment-switcher"></section>
          <section id="session-controls"></section>
          <section id="parameter-panel"></section>
        </aside>
        <section class="viewport" id="viewport-stage">
          <div class="viewport-pane viewport-pane--a">
            <span class="viewport-pane__label">A</span>
            <canvas id="simulation-canvas"></canvas>
          </div>
          <div class="viewport-pane viewport-pane--b" id="comparison-pane" hidden>
            <span class="viewport-pane__label">B</span>
            <canvas id="comparison-canvas"></canvas>
          </div>
        </section>
        <aside class="panel panel--results">
          <section id="scalar-display"></section>
          <section id="graph-system"></section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
