<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praxi Physics Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="top-bar__brand" id="top-bar-brand"></div>
        <div class="top-bar__switcher" id="experiment-switcher"></div>
        <div class="top-bar__actions" id="top-bar-actions"></div>
      </header>
      <main class="app-body">
        <aside class="panel panel--params" id="parameter-panel"></aside>
        <section class="viewport">
          <canvas id="simulation-canvas"></canvas>
        </section>
        <aside class="panel panel--results">
          <section id="scalar-display"></section>
          <section id="graph-system"></section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
